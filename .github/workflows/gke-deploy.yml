name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: your-gcp-project-id
  GKE_CLUSTER: your-cluster-name
  GKE_ZONE: your-cluster-zone
  DEPLOYMENT_NAME: finance-app
  IMAGE: finance-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build Docker Image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }}

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $PROJECT_ID

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/$DEPLOYMENT_NAME $IMAGE=gcr.io/$PROJECT_ID/$IMAGE:${{ github.sha }}
