name: CD – Student Dashboard to PaaS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: student-dashboard
  IMAGE_TAG: v1.0-frontend

jobs:
  # ─────────────────────────────────────────
  # Job 1 – Build & Push Docker Image
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # Job 2 – Deploy to PaaS (Render.com)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to PaaS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Render deployment
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" | jq .

      - name: Deployment summary
        run: |
          echo "✅ Deployed $IMAGE_NAME:$IMAGE_TAG to PaaS"
          echo "🔗 URL: ${{ secrets.PAAS_APP_URL }}"
